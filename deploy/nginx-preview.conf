server {
    listen 80;
    listen [::]:80;
    server_name parkhotel.82-39-215-202.nip.io;

    root /var/www/parkhotel;
    index index.php;

    access_log /var/log/nginx/parkhotel.access.log;
    error_log /var/log/nginx/parkhotel.error.log;
    client_max_body_size 12m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~ ^/(?:app|var|docs|deploy)(?:/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /uploads/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param PARKHOTEL_ADMIN_PASSWORD_HASH_FILE /etc/parkhotel/admin_password_hash;
        fastcgi_param PHP_VALUE "session.cookie_secure=1\nsession.cookie_httponly=1\nsession.cookie_samesite=Lax\nupload_max_filesize=10M\npost_max_size=12M";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
